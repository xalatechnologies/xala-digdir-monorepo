ssa_l_mapping:
  - clause: "1.3"
    requirement: Role separation
    roadmap_ref: P0-02
    implementation: RBAC enforced at API layer
    status: PARTIAL

  - clause: "2.1"
    requirement: Audit logging
    roadmap_ref: P5-01
    implementation: Audit service with structured events
    status: PARTIAL

  - clause: "2.2"
    requirement: Traceability
    roadmap_ref: P5-01
    implementation: Full mutation logging with context
    status: PARTIAL

  - clause: "3.1"
    requirement: Access control
    roadmap_ref: P0-02
    implementation: Capability-based guards
    status: PARTIAL

  - clause: "3.2"
    requirement: Authentication
    roadmap_ref: P1-01
    implementation: Session management with token refresh
    status: PARTIAL

  - clause: "4.1"
    requirement: Availability
    roadmap_ref: P5-01
    implementation: Monitoring and alerting
    status: PLANNED

  - clause: "5.1"
    requirement: GDPR compliance
    roadmap_ref:
      - P0-02
      - P5-01
    implementation: Data access controls and audit logging
    status: PARTIAL

  - clause: "6.1"
    requirement: Change management
    roadmap_ref: P4-01
    implementation: Tenant configuration management
    status: PLANNED

  - clause: "7.1"
    requirement: Documentation
    roadmap_ref: ALL
    implementation: Comprehensive CLAUDE.md and roadmap
    status: DONE

