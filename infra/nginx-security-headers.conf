# Security Headers Configuration for Nginx
# Add this to your Nginx server blocks for all frontends

# Prevent clickjacking attacks
add_header X-Frame-Options "DENY" always;

# Prevent MIME-sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS Protection (legacy but still useful)
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS (already configured, but included for completeness)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy (adjust based on your needs)
# This is a basic policy - you may need to customize it
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.digilist.no wss://api.digilist.no;" always;

# Permissions Policy (formerly Feature-Policy)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Example Nginx server block configuration:
#
# server {
#     listen 443 ssl http2;
#     server_name web-test.digilist.no;
#
#     # Include security headers
#     include /etc/nginx/security-headers.conf;
#
#     # ... rest of your configuration
# }
