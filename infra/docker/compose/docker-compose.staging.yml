version: '3.8'

# ==============================================================================
# DIGILIST PLATFORM - STAGING DOCKER COMPOSE
# ==============================================================================
# Complete staging environment with all applications and services
# Optimized for testing before production deployment
# ==============================================================================

services:
  # ===========================================================================
  # INFRASTRUCTURE SERVICES
  # ===========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: digilist-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digilist_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digilist_staging_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-digilist_staging}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digilist_staging} -d ${POSTGRES_DB:-digilist_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digilist-staging

  # Redis (for sessions and queues)
  redis:
    image: redis:7-alpine
    container_name: digilist-staging-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digilist-staging

  # ===========================================================================
  # BACKEND API
  # ===========================================================================

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: digilist-staging-api
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-digilist_staging}:${POSTGRES_PASSWORD:-digilist_staging_secure_2026}@postgres:5432/${POSTGRES_DB:-digilist_staging}
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: staging
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

  # ===========================================================================
  # FRONTEND APPLICATIONS (Production Builds with Nginx)
  # ===========================================================================

  # Web App (Public Website)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        APP_NAME: web
    container_name: digilist-staging-web
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

  # MinSide App (User Portal)
  minside:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        APP_NAME: minside
    container_name: digilist-staging-minside
    restart: unless-stopped
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

  # Backoffice App (Admin Portal)
  backoffice:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        APP_NAME: backoffice
    container_name: digilist-staging-backoffice
    restart: unless-stopped
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

  # Tenant Admin App
  tenant-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        APP_NAME: tenant-admin
    container_name: digilist-staging-tenant-admin
    restart: unless-stopped
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

  # SaaS Admin App
  saas-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        APP_NAME: saas-admin
    container_name: digilist-staging-saas-admin
    restart: unless-stopped
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

  # Monitoring App
  monitoring:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        APP_NAME: monitoring
    container_name: digilist-staging-monitoring
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

  # Docs & Learning App
  docs-learning:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: production
      args:
        APP_NAME: docs-learning
    container_name: digilist-staging-docs-learning
    restart: unless-stopped
    ports:
      - "8086:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-staging

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local

networks:
  digilist-staging:
    name: digilist-staging-network
    driver: bridge

# ==============================================================================
# USAGE INSTRUCTIONS
# ==============================================================================
#
# 1. Build all images:
#    docker-compose -f docker-compose.staging.yml build
#
# 2. Start all services:
#    docker-compose -f docker-compose.staging.yml up -d
#
# 3. View logs:
#    docker-compose -f docker-compose.staging.yml logs -f
#
# 4. Stop all services:
#    docker-compose -f docker-compose.staging.yml down
#
# 5. Run migrations:
#    docker-compose -f docker-compose.staging.yml exec api pnpm db:migrate
#
# 6. Seed database:
#    docker-compose -f docker-compose.staging.yml exec api pnpm db:seed
#
# ==============================================================================
# ENVIRONMENT VARIABLES
# ==============================================================================
#
# Required environment variables (set in .env.staging):
# - POSTGRES_USER
# - POSTGRES_PASSWORD
# - POSTGRES_DB
# - JWT_SECRET
# - JWT_REFRESH_SECRET
# - CSRF_SECRET
# - SESSION_SECRET
# - CORS_ORIGIN
# - SENTRY_DSN
#
# ==============================================================================
