# Docker Compose for Development - PostgreSQL and Redis only
# All applications run directly on host machine for faster development

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: digilist-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digilist_dev
      POSTGRES_PASSWORD: dev_password_2026
      POSTGRES_DB: digilist_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digilist_dev -d digilist_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digilist-dev

  redis:
    image: redis:7-alpine
    container_name: digilist-dev-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digilist-dev

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  digilist-dev:
    driver: bridge
