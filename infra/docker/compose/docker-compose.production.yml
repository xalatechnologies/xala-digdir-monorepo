version: '3.8'

# ==============================================================================
# DIGILIST PLATFORM - PRODUCTION DOCKER COMPOSE
# ==============================================================================
# Complete production environment with all applications and services
# Optimized for performance, security, and reliability
# ==============================================================================

services:
  # ===========================================================================
  # INFRASTRUCTURE SERVICES
  # ===========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: digilist-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost access
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups  # Backup directory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis (for sessions and queues)
  redis:
    image: redis:7-alpine
    container_name: digilist-prod-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"  # Only localhost access
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # BACKEND API
  # ===========================================================================

  api:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.api
      target: production
    container_name: digilist-prod-api
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_PORT: 4000
      API_HOST: 0.0.0.0
      
      # Security
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN}
      
      # Monitoring
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      
      # OAuth
      IDPORTEN_CLIENT_ID: ${IDPORTEN_CLIENT_ID}
      IDPORTEN_CLIENT_SECRET: ${IDPORTEN_CLIENT_SECRET}
      IDPORTEN_BASE_URL: ${IDPORTEN_BASE_URL}
      IDPORTEN_CALLBACK_URL: ${IDPORTEN_CALLBACK_URL}
      
      VIPPS_CLIENT_ID: ${VIPPS_CLIENT_ID}
      VIPPS_CLIENT_SECRET: ${VIPPS_CLIENT_SECRET}
      VIPPS_SUBSCRIPTION_KEY: ${VIPPS_SUBSCRIPTION_KEY}
      
      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      
      # Storage
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      
    ports:
      - "127.0.0.1:4000:4000"  # Only localhost access (use reverse proxy)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ===========================================================================
  # FRONTEND APPLICATIONS (Production Builds with Nginx)
  # ===========================================================================

  # Web App (Public Website)
  web:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.frontend
      target: production
      args:
        APP_NAME: web
    container_name: digilist-prod-web
    restart: always
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MinSide App (User Portal)
  minside:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.frontend
      target: production
      args:
        APP_NAME: minside
    container_name: digilist-prod-minside
    restart: always
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backoffice App (Admin Portal)
  backoffice:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.frontend
      target: production
      args:
        APP_NAME: backoffice
    container_name: digilist-prod-backoffice
    restart: always
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Tenant Admin App
  tenant-admin:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.frontend
      target: production
      args:
        APP_NAME: tenant-admin
    container_name: digilist-prod-tenant-admin
    restart: always
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # SaaS Admin App
  saas-admin:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.frontend
      target: production
      args:
        APP_NAME: saas-admin
    container_name: digilist-prod-saas-admin
    restart: always
    ports:
      - "8084:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Monitoring App
  monitoring:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.frontend
      target: production
      args:
        APP_NAME: monitoring
    container_name: digilist-prod-monitoring
    restart: always
    ports:
      - "8085:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Docs & Learning App
  docs-learning:
    build:
      context: ../../..
      dockerfile: infra/docker/dockerfiles/Dockerfile.frontend
      target: production
      args:
        APP_NAME: docs-learning
    container_name: digilist-prod-docs-learning
    restart: always
    ports:
      - "8086:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - digilist-prod
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  digilist-prod:
    name: digilist-prod-network
    driver: bridge

# ==============================================================================
# PRODUCTION DEPLOYMENT INSTRUCTIONS
# ==============================================================================
#
# PREREQUISITES:
# 1. Set all required environment variables in .env.production
# 2. Ensure SSL certificates are configured
# 3. Set up reverse proxy (Nginx/Traefik) for HTTPS
# 4. Configure firewall rules
# 5. Set up backup strategy
# 6. Configure monitoring and alerting
#
# DEPLOYMENT:
# 1. Build all images:
#    docker-compose -f docker-compose.production.yml build --no-cache
#
# 2. Run database migrations:
#    docker-compose -f docker-compose.production.yml run --rm api pnpm db:migrate
#
# 3. Start all services:
#    docker-compose -f docker-compose.production.yml up -d
#
# 4. Verify all services are healthy:
#    docker-compose -f docker-compose.production.yml ps
#
# 5. Check logs:
#    docker-compose -f docker-compose.production.yml logs -f
#
# BACKUP:
# - Database: docker-compose -f docker-compose.production.yml exec postgres \
#             pg_dump -U ${POSTGRES_USER} ${POSTGRES_DB} > backup.sql
# - Restore: docker-compose -f docker-compose.production.yml exec -T postgres \
#            psql -U ${POSTGRES_USER} ${POSTGRES_DB} < backup.sql
#
# MONITORING:
# - Health checks: All services have health checks configured
# - Logs: JSON format for log aggregation (ELK, Datadog, etc.)
# - Metrics: Integrate with Prometheus/Grafana
# - Sentry: Error tracking and performance monitoring
#
# SECURITY:
# - All secrets must be set via environment variables
# - Database and Redis only accessible from localhost
# - Use reverse proxy for SSL termination
# - Regular security updates
# - Automated backups
#
# ==============================================================================
