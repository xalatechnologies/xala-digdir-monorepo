# API Recording and Alert Rules
groups:
  - name: api_recording_rules
    interval: 30s
    rules:
      # Request rate by endpoint
      - record: api:http_request_rate:5m
        expr: sum(rate(http_request_total[5m])) by (endpoint, method, status)

      # Error rate
      - record: api:http_error_rate:5m
        expr: sum(rate(http_request_total{status=~"5.."}[5m])) by (endpoint, method)

      # Latency percentiles
      - record: api:http_request_duration:p50
        expr: histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint))

      - record: api:http_request_duration:p95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint))

      - record: api:http_request_duration:p99
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint))

  - name: api_alerts
    rules:
      # Critical: High error rate
      - alert: HighAPIErrorRate
        expr: (sum(rate(http_request_total{status=~"5.."}[5m])) / sum(rate(http_request_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: critical
          priority: P0
        annotations:
          summary: "High API error rate detected"
          description: "API error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Critical: API down
      - alert: APIDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P0
        annotations:
          summary: "API is down"
          description: "API server is not responding"

      # Warning: High latency
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)) > 1
        for: 10m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "High API latency detected"
          description: "API p95 latency is {{ $value }}s on {{ $labels.endpoint }}"

      # Warning: High request rate
      - alert: HighAPIRequestRate
        expr: sum(rate(http_request_total[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          priority: P1
        annotations:
          summary: "Unusually high API request rate"
          description: "API receiving {{ $value }} requests/second"
