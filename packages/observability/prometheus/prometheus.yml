# Prometheus Configuration for Digilist Platform
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'digilist-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - 'rules/*.yml'

# Scrape configurations
scrape_configs:
  # API Server
  - job_name: 'api'
    static_configs:
      - targets: ['api:4000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Web App (client-side metrics if exposed)
  - job_name: 'web'
    static_configs:
      - targets: ['web:5173']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # MinSide App
  - job_name: 'minside'
    static_configs:
      - targets: ['minside:5174']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Backoffice App
  - job_name: 'backoffice'
    static_configs:
      - targets: ['backoffice:5175']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # SaaS Admin App
  - job_name: 'saas-admin'
    static_configs:
      - targets: ['saas-admin:5176']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
