name: Nightly Quality Suite

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 2 AM UTC
  workflow_dispatch: # Allow manual trigger

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================================================
  # SCHEMA COVERAGE
  # ============================================================================
  schema-coverage:
    name: Schema Coverage Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: digilist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Migrations
        run: pnpm --filter @digilist/api db:migrate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/digilist_test

      - name: Run Schema Coverage Tests
        run: pnpm test:schema
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/digilist_test

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: schema-coverage
          path: tests/reports/SCHEMA-COVERAGE.json
          retention-days: 30

  # ============================================================================
  # RBAC MATRIX
  # ============================================================================
  rbac-matrix:
    name: RBAC Matrix Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: digilist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start API Server
        run: |
          pnpm --filter @digilist/api dev &
          sleep 10
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/digilist_test
          NODE_ENV: test

      - name: Run RBAC Tests
        run: pnpm test:rbac
        env:
          API_URL: http://localhost:3000/api

      - name: Upload RBAC Matrix
        uses: actions/upload-artifact@v4
        with:
          name: rbac-matrix
          path: tests/reports/RBAC-MATRIX.json
          retention-days: 30

  # ============================================================================
  # GDPR COMPLIANCE
  # ============================================================================
  gdpr-compliance:
    name: GDPR Compliance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run GDPR Tests
        run: pnpm test:gdpr
        continue-on-error: true

  # ============================================================================
  # BOOKING E2E
  # ============================================================================
  booking-e2e:
    name: Booking E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build Apps
        run: pnpm build

      - name: Run Booking E2E
        run: pnpm test:booking
        continue-on-error: true
        env:
          CI: true

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-e2e-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # SAAS ADMIN E2E
  # ============================================================================
  saas-admin-e2e:
    name: SaaS Admin E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build SaaS Admin
        run: pnpm --filter @xala/saas-admin build

      - name: Run SaaS Admin E2E
        run: pnpm exec playwright test --config=playwright.saas-admin.config.ts
        continue-on-error: true
        env:
          CI: true

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saas-admin-e2e-report
          path: playwright-report/saas-admin/
          retention-days: 7

  # ============================================================================
  # MINSIDE E2E
  # ============================================================================
  minside-e2e:
    name: MinSide E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run MinSide E2E
        run: pnpm exec playwright test --config=playwright.minside.config.ts --reporter=html
        continue-on-error: true
        env:
          CI: true
          MINSIDE_URL: https://minside.digilist.no

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minside-e2e-report
          path: playwright-report-minside/
          retention-days: 7

  # ============================================================================
  # WEB E2E
  # ============================================================================
  web-e2e:
    name: Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Web E2E
        run: pnpm exec playwright test --config=playwright.web.config.ts --reporter=html
        continue-on-error: true
        env:
          CI: true
          WEB_URL: https://digilist.no

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e-report
          path: playwright-report-web/
          retention-days: 7

  # ============================================================================
  # WCAG ACCESSIBILITY
  # ============================================================================
  wcag-audit:
    name: WCAG 2.1 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + Axe
        run: |
          npx playwright install --with-deps chromium
          pnpm add -D @axe-core/playwright

      - name: Build Apps
        run: pnpm build

      - name: Run WCAG Tests
        run: pnpm test:wcag
        continue-on-error: true
        env:
          CI: true

      - name: Upload WCAG Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wcag-report
          path: playwright-report/
          retention-days: 30

  # ============================================================================
  # SECURITY HEADERS
  # ============================================================================
  security-headers:
    name: Security Header Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Security Tests
        run: pnpm test:security
        continue-on-error: true

  # ============================================================================
  # SUMMARY
  # ============================================================================
  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs:
      - schema-coverage
      - rbac-matrix
      - gdpr-compliance
      - booking-e2e
      - saas-admin-e2e
      - minside-e2e
      - web-e2e
      - wcag-audit
      - security-headers
    if: always()
    steps:
      - name: Create Summary
        run: |
          echo "# Nightly Quality Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schema Coverage | ${{ needs.schema-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RBAC Matrix | ${{ needs.rbac-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GDPR Compliance | ${{ needs.gdpr-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Booking E2E | ${{ needs.booking-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SaaS Admin E2E** | ${{ needs.saas-admin-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **MinSide E2E** | ${{ needs.minside-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Web E2E** | ${{ needs.web-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| WCAG Audit | ${{ needs.wcag-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Headers | ${{ needs.security-headers.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run Date: $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::warning::Some nightly tests failed. Check artifacts for details."
