name: Comprehensive Testing Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK Unit Tests
        run: pnpm test:sdk:all

      - name: Run API Unit Tests
        run: pnpm --filter @digilist/api test -- --run
        continue-on-error: true

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/client-sdk/coverage/lcov.info
          flags: unit-tests
          fail_ci_if_error: false

  # ============================================================================
  # SDK CONTRACT TESTS
  # ============================================================================
  contract-tests:
    name: Contract Compliance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract Parity Tests
        run: pnpm test:contracts

      - name: RFC7807 Compliance Tests
        run: pnpm test:rfc7807

      - name: Terminology Compliance Tests
        run: pnpm test:sdk:terminology

      - name: SDK Export Tests
        run: pnpm test:sdk:exports

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Integration Tests
        run: pnpm --filter @digilist/client-sdk test -- --run src/__tests__/integration/

  # ============================================================================
  # E2E TESTS - PLAYWRIGHT
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build Apps
        run: pnpm build

      - name: Run E2E Tests
        run: npx playwright test e2e/auth.spec.ts e2e/booking-flow.spec.ts
        env:
          CI: true
          BASE_URL: http://localhost:5173

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # ACCESSIBILITY TESTS
  # ============================================================================
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install axe-core
        run: pnpm add -D @axe-core/playwright

      - name: Build Apps
        run: pnpm build

      - name: Run Accessibility Tests
        run: npx playwright test e2e/accessibility.spec.ts
        continue-on-error: true
        env:
          CI: true

      - name: Upload Accessibility Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # SECURITY TESTS
  # ============================================================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Apps
        run: pnpm build

      - name: Run Security Tests
        run: npx playwright test e2e/security.spec.ts
        continue-on-error: true
        env:
          CI: true

      - name: Dependency Vulnerability Scan
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # PERFORMANCE TESTS
  # ============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Apps
        run: pnpm build

      - name: Run Performance Tests
        run: npx playwright test e2e/performance.spec.ts
        continue-on-error: true
        env:
          CI: true

      - name: Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun || true
        continue-on-error: true

      - name: Upload Performance Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # i18n COMPLIANCE
  # ============================================================================
  i18n-compliance:
    name: i18n Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build i18n package
        run: pnpm -F @xala/i18n build

      - name: Check translation key parity
        run: pnpm i18n:check

      - name: Run i18n unit tests
        run: pnpm -F @xala/i18n test

      - name: Scan for hardcoded strings in minside
        run: node scripts/scan-i18n.js apps/minside/src
        continue-on-error: true

      - name: Scan for hardcoded strings in backoffice
        run: node scripts/scan-i18n.js apps/backoffice/src
        continue-on-error: true

      - name: Scan for hardcoded strings in web
        run: node scripts/scan-i18n.js apps/web/src
        continue-on-error: true

      - name: Report unused keys (informational)
        run: pnpm i18n:unused || true

  # ============================================================================
  # GDPR COMPLIANCE TESTS
  # ============================================================================
  gdpr-compliance:
    name: GDPR Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Apps
        run: pnpm build

      - name: Run GDPR Compliance Tests
        run: npx playwright test packages/testing/suites/compliance/gdpr/
        continue-on-error: true
        env:
          CI: true

      - name: Upload GDPR Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdpr-compliance-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # VISUAL REGRESSION TESTS
  # ============================================================================
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Apps
        run: pnpm build

      - name: Run Visual Regression Tests
        run: npx playwright test packages/testing/suites/visual-regression/
        continue-on-error: true
        env:
          CI: true

      - name: Upload Visual Regression Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # USER STORY TESTS
  # ============================================================================
  user-story-tests:
    name: User Story Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Apps
        run: pnpm build

      - name: Run User Story Tests
        run: npx playwright test packages/testing/suites/user-stories/
        continue-on-error: true
        env:
          CI: true

      - name: Upload User Story Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-story-report
          path: playwright-report/
          retention-days: 7

  # ============================================================================
  # LINT AND TYPE CHECK
  # ============================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint
        continue-on-error: true

      - name: TypeScript Check
        run: pnpm -r exec tsc --noEmit
        continue-on-error: true

      - name: Contract Compliance Lint
        run: pnpm lint:contracts

  # ============================================================================
  # BUILD VERIFICATION
  # ============================================================================
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build All Packages
        run: pnpm build

      - name: Verify SDK Build
        run: |
          ls -la packages/client-sdk/dist/
          test -f packages/client-sdk/dist/index.js

      - name: Verify Web Build
        run: |
          ls -la apps/web/dist/
          test -f apps/web/dist/index.html

  # ============================================================================
  # SUMMARY REPORT
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - contract-tests
      - integration-tests
      - e2e-tests
      - accessibility-tests
      - security-tests
      - performance-tests
      - i18n-compliance
      - gdpr-compliance
      - visual-regression
      - user-story-tests
      - lint-and-typecheck
      - build-verification
    if: always()
    steps:
      - name: Create Summary
        run: |
          echo "# Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Tests | ${{ needs.contract-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accessibility | ${{ needs.accessibility-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| i18n Compliance | ${{ needs.i18n-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GDPR Compliance | ${{ needs.gdpr-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression | ${{ needs.visual-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| User Stories | ${{ needs.user-story-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Types | ${{ needs.lint-and-typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-verification.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check Results
        run: |
          if [ "${{ needs.unit-tests.result }}" == "failure" ] || \
             [ "${{ needs.contract-tests.result }}" == "failure" ] || \
             [ "${{ needs.i18n-compliance.result }}" == "failure" ] || \
             [ "${{ needs.build-verification.result }}" == "failure" ]; then
            echo "Critical tests failed!"
            exit 1
          fi
          echo "All critical tests passed!"
