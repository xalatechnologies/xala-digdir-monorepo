name: E2E Golden Booking Journey

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/minside/**'
      - 'apps/backoffice/**'
      - 'apps/api/**'
      - 'packages/client-sdk/**'
      - 'packages/ds/**'
      - 'packages/testing-e2e/suites/golden-journey/**'
  push:
    branches:
      - main
      - develop
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'approve'
        type: choice
        options:
          - approve
          - reject
          - full

jobs:
  e2e-golden-journey:
    name: Golden Journey E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: digilist_test
          POSTGRES_PASSWORD: digilist_test
          POSTGRES_DB: digilist_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://digilist_test:digilist_test@localhost:5432/digilist_test
      NODE_ENV: test
      API_BASE_URL: http://localhost:4000
      WEB_BASE_URL: http://localhost:5173
      MINSIDE_BASE_URL: http://localhost:5174
      BACKOFFICE_BASE_URL: http://localhost:5175

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @digilist/database-schema build
          pnpm --filter @digilist/client-sdk build
          pnpm --filter @xala/ds build
          pnpm --filter @xala/i18n build

      - name: Run database migrations
        working-directory: apps/api
        run: pnpm db:migrate

      - name: Seed E2E test data
        run: pnpm tsx packages/testing-e2e/seeds/e2e-golden-journey.seed.ts

      - name: Install Playwright browsers
        run: pnpm --filter @xala/testing-e2e playwright install --with-deps chromium

      - name: Start API server
        run: |
          pnpm --filter @digilist/api build
          pnpm --filter @digilist/api start &
          # Wait for API to be ready
          npx wait-on http://localhost:4000/health --timeout 60000

      - name: Start Web app
        run: |
          pnpm --filter @xala/web build
          pnpm --filter @xala/web preview --port 5173 &
          npx wait-on http://localhost:5173 --timeout 60000

      - name: Start MinSide app
        run: |
          pnpm --filter @xala/minside build
          pnpm --filter @xala/minside preview --port 5174 &
          npx wait-on http://localhost:5174 --timeout 60000

      - name: Start Backoffice app
        run: |
          pnpm --filter @xala/backoffice build
          pnpm --filter @xala/backoffice preview --port 5175 &
          npx wait-on http://localhost:5175 --timeout 60000

      - name: Run E2E Golden Journey tests
        working-directory: packages/testing-e2e
        run: |
          if [ "${{ github.event.inputs.test_suite }}" == "approve" ]; then
            pnpm playwright test --config=playwright-golden-journey.config.ts golden-journey-full.spec.ts
          elif [ "${{ github.event.inputs.test_suite }}" == "reject" ]; then
            pnpm playwright test --config=playwright-golden-journey.config.ts golden-journey-reject.spec.ts
          else
            pnpm playwright test --config=playwright-golden-journey.config.ts
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-journey-test-results
          path: |
            packages/testing-e2e/test-results/
            packages/testing-e2e/playwright-report/
          retention-days: 30

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-journey-traces
          path: packages/testing-e2e/test-results/artifacts/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'packages/testing-e2e/test-results/results.json';
            
            if (!fs.existsSync(resultsPath)) {
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const passed = results.suites.reduce((acc, s) => acc + s.specs.filter(sp => sp.ok).length, 0);
            const failed = results.suites.reduce((acc, s) => acc + s.specs.filter(sp => !sp.ok).length, 0);
            const total = passed + failed;
            
            const status = failed === 0 ? '✅' : '❌';
            
            const comment = `## ${status} Golden Booking Journey E2E Tests
            
            - **Total:** ${total}
            - **Passed:** ${passed}
            - **Failed:** ${failed}
            
            ${failed > 0 ? '[View traces and screenshots in artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})' : ''}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Notify on nightly failure
        if: github.event.schedule && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Nightly E2E Golden Journey failed',
              body: `Nightly Golden Booking Journey E2E tests failed.
              
              [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `,
              labels: ['e2e', 'bug', 'high-priority']
            });
